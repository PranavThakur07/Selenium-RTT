[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v -s --strict-markers --tb=short

markers =
    smoke: Smoke test suite
    planner: Roadtrip planner tests
    tc001: Test Case 001 - Roadtrip creation with From and To locations
    tc002: Test Case 002 - GPX Import Multi-Waypoint Roadtrip
    tc003: Test Case 003 - Multi-Roadtrip Editing and State Isolation
    tc004: Test Case 004 - Invalid Route Handling and Distance Limit Validation
    tc005: Test Case 005 - Roadtrip Lifecycle, Persistence & Planner State Regression
    tc006: Test Case 006 - Waypoint Deletion, Route Restructuring & Planner Recovery
    tc007: Test Case 007 - Stops, Route Editing & Map Waypoint Placement
    tc008: Test Case 008 - Roadtrip Details, Date/Time Changes & Persistence
    gpx: GPX import and route validation tests
    editing: Roadtrip editing and switching tests
    invalid_routes: Invalid route handling and calculation tests
    lifecycle: Roadtrip lifecycle and state regression tests
    waypoints: Waypoint manipulation tests
    deletion: Waypoint deletion and route restructuring tests
    stops: Waypoint stop and passthrough toggle tests
    route_editing: Route details and roadtrip editing tests
    map: Mapbox direct map waypoint placement and pin dragging tests
    roadtrip_details: Roadtrip-level metadata, dates, and description editing tests
    date_time: Date and time change behavior tests
    persistence: Data persistence and reopening verification tests
    regression: Full regression suite

# Let framework custom colored logger handle stdout directly without duplicate capture
log_cli = false
